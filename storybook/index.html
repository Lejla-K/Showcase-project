<!DOCTYPE html>
<html lang="en" data-sb-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peau App — Component Storybook</title>
  <meta name="description" content="A Storybook-style browser for the Peau App design system, built from the Figma component library.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/storybook.css">
</head>
<body>

<div class="sb">

  <!-- ============ Sidebar ============ -->
  <aside class="sb-sidebar">
    <div class="sb-brand">
      <span class="sb-brand__mark">P</span>
      <span>
        <span class="sb-brand__name">Peau App</span><br>
        <span class="sb-brand__sub">Design system · Storybook</span>
      </span>
    </div>

    <div class="sb-search">
      <input id="sb-search" type="search" placeholder="Find components…" aria-label="Find components">
    </div>

    <nav class="sb-tree" id="sb-tree" aria-label="Components"></nav>
  </aside>

  <!-- ============ Main ============ -->
  <main class="sb-main">

    <div class="sb-toolbar">
      <span class="sb-toolbar__title" id="sb-title"></span>

      <select class="sb-tool" id="sb-bg" aria-label="Canvas background">
        <option value="light">Surface</option>
        <option value="container">Primary container</option>
        <option value="dark">On surface</option>
        <option value="grid">Grid</option>
      </select>

      <select class="sb-tool" id="sb-viewport" aria-label="Viewport">
        <option value="auto">Auto width</option>
        <option value="mobile">Mobile · 412px</option>
        <option value="tablet">Tablet · 768px</option>
        <option value="desktop">Desktop · 1140px</option>
      </select>

      <select class="sb-tool" id="sb-zoom" aria-label="Zoom">
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
      </select>

      <button class="sb-tool" id="sb-theme" type="button" aria-pressed="false">🌙 Dark UI</button>
      <button class="sb-tool" id="sb-copy" type="button">Copy HTML</button>
      <a class="sb-tool" id="sb-figma" href="#" target="_blank" rel="noopener">Open in Figma ↗</a>
    </div>

    <div class="sb-canvas sb-canvas--grid" id="sb-canvas">
      <div class="sb-canvas__stage" id="sb-stage">
        <div class="sb-canvas__inner" id="sb-inner"></div>
      </div>
    </div>

    <!-- ============ Addon panel ============ -->
    <section class="sb-panel" id="sb-panel" data-collapsed="false">
      <div class="sb-panel__tabs" role="tablist">
        <button class="sb-panel__tab" data-view="controls" role="tab" aria-selected="true">
          Controls<span class="sb-panel__count" id="sb-ctrl-count">0</span>
        </button>
        <button class="sb-panel__tab" data-view="code" role="tab" aria-selected="false">Code</button>
        <button class="sb-panel__tab" data-view="docs" role="tab" aria-selected="false">Docs</button>
        <button class="sb-tool sb-panel__collapse" id="sb-panel-toggle" type="button">Hide addons</button>
      </div>

      <div class="sb-panel__body">
        <div class="sb-panel__view" id="sb-view-controls" role="tabpanel"></div>
        <div class="sb-panel__view" id="sb-view-code" role="tabpanel" hidden></div>
        <div class="sb-panel__view" id="sb-view-docs" role="tabpanel" hidden></div>
      </div>
    </section>

  </main>
</div>

<script src="js/stories.js"></script>
<script src="js/storybook.js"></script>
</body>
</html>
